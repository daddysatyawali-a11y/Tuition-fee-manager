<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuition Fee Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ============ Foundations ============ */
:root{
  --bg:#080a0d;--surface:#12151a;--surface2:#191d23;--surface3:#222831;
  --text:#f4f6f8;--muted:#9da6b1;--line:#2a313a;--accent:#7898c7;
  --accentText:#071018;--good:#6fbd98;--warn:#c8a95d;--danger:#cf737c;
  --shadow:0 8px 24px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:auto}
body{
  min-height:100vh;color:var(--text);
  background:
    radial-gradient(900px 500px at 8% -8%, rgba(116,88,255,.07), transparent 62%),
    radial-gradient(800px 500px at 100% 0%, rgba(35,180,190,.055), transparent 60%),
    linear-gradient(145deg,#07090c 0%,#0a0d11 45%,#080a0e 100%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
a{color:inherit}
.app{min-height:100vh}

/* ============ Buttons & inputs ============ */
.btn{border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:700;background:var(--surface2);color:var(--text);min-height:44px;transition:transform .12s ease,background .15s ease,border-color .15s ease}
.btn:hover{background:var(--surface3)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.btn-primary:hover{background:#86a6d4}
.btn-light{background:var(--surface2);color:var(--text)}
.btn-danger{background:rgba(255,107,107,.12);color:#ff8b8b;border-color:rgba(255,107,107,.22)}
.btn-danger:hover{background:rgba(255,107,107,.2)}
.btn-small{padding:8px 13px;font-size:12px;min-height:38px}
.btn-block{width:100%}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;outline:none;background:var(--surface2);color:var(--text)}
input::placeholder,textarea::placeholder{color:#69717b}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:none}
select option{background:#111418;color:#fff}
input[type="date"],input[type="month"]{color-scheme:dark;cursor:pointer;min-height:48px}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:.85;cursor:pointer}


html[data-theme="light"]{
  --bg:#f4f6f8;--surface:#ffffff;--surface2:#f0f2f5;--surface3:#e5e8ed;
  --text:#161a1f;--muted:#66707c;--line:#d7dce2;--accent:#5579ad;
  --accentText:#ffffff;--good:#2f8f68;--warn:#a47d27;--danger:#b84d58;
  --shadow:0 6px 18px rgba(20,30,45,.10);
}
html[data-theme="light"] body{background:linear-gradient(145deg,#f7f8fa 0%,#f1f3f6 100%);}
html[data-theme="light"] .topbar{background:rgba(244,246,248,.88);border-bottom-color:rgba(20,30,45,.08)}
html[data-theme="light"] input[type="date"],html[data-theme="light"] input[type="month"]{color-scheme:light}
.theme-toggle{width:42px;height:42px;min-width:42px;border-radius:12px;padding:0;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none;margin-left:auto}
.page-header-title{min-width:0;flex:1}.page-header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}.help-btn{width:42px;height:42px;min-width:42px;border-radius:12px;font-size:20px;font-weight:900}.profile-page-header{align-items:center}.profile-page-header .page-title{margin:0}.profile-page-header .page-subtitle{margin-top:2px}
.profile-head-actions{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}
.icon-btn{width:44px;height:44px;min-width:44px;border-radius:12px;padding:0;display:grid;place-items:center;font-size:19px;font-weight:800}
.icon-btn-danger{background:rgba(184,77,88,.12);color:#e06b76;border-color:rgba(184,77,88,.24)}
.profile-settings-card.compact{margin-bottom:14px}
.profile-settings-card.compact .profile-settings-avatar{width:58px;height:58px}

/* ============ Light-theme contrast fixes ============ */
html[data-theme="light"] .home-overview{
  background:linear-gradient(145deg,#ffffff,#f4f6f8);
  border-color:#d7dce2;
  box-shadow:0 7px 20px rgba(20,30,45,.10);
}
html[data-theme="light"] .class-tabs{border-bottom-color:#dfe3e8}
html[data-theme="light"] .class-tab{
  border-color:#d7dce2;background:#eef1f4;color:#4f5965;
}
html[data-theme="light"] .class-tab.active{
  background:#dce6f4;color:#244d80;border-color:#8fa9cf;
}
html[data-theme="light"] .fab-transaction{
  background:#6f95cf;color:#ffffff;border-color:#6f95cf;
}
html[data-theme="light"] .fab-add{
  background:#6f95cf;color:#ffffff;border-color:#6f95cf;
}
html[data-theme="light"] .dashboard .stat{
  background:linear-gradient(145deg,#ffffff,#f0f2f5);
  border-color:#d7dce2;
  box-shadow:0 5px 14px rgba(20,30,45,.10);
}
html[data-theme="light"] .dashboard .stat:first-child .stat-value{color:#356db7}
html[data-theme="light"] .dashboard .stat:nth-child(2) .stat-value{color:#20815c}
html[data-theme="light"] .stat-label{color:#58636f}
html[data-theme="light"] .profile-stat-value{color:#20262d}
html[data-theme="light"] .stat-total .profile-stat-value{color:#356db7}
html[data-theme="light"] .stat-paid .profile-stat-value{color:#20815c}
html[data-theme="light"] .stat-balance .profile-stat-value{color:#c85f32}
html[data-theme="light"] .stat-revenue-value{color:#20815c}
html[data-theme="light"] .progress-card-percent{color:#287a59}
html[data-theme="light"] .progress-card-meta{color:#4f5965}
html[data-theme="light"] .progress-track{background:#d9dee5;border-color:#c7cdd5;box-shadow:inset 0 1px 2px rgba(20,30,45,.16)}
html[data-theme="light"] .progress-fill{background:linear-gradient(90deg,#4f80c0,#2f9369)}
html[data-theme="light"] .profile-settings-avatar,
html[data-theme="light"] .profile-avatar,
html[data-theme="light"] .teacher-profile-btn{background:#e2e6eb;color:#20262d}
html[data-theme="light"] .profile-settings-card{background:#ffffff}
html[data-theme="light"] .settings-class.selected{background:#e2e6eb;color:#20262d;border-color:#d2d7dd}
html[data-theme="light"] .about-app{
  background:#f0f2f5;
  border-color:#d7dce2;
}
html[data-theme="light"] .report-export-card{
  background:linear-gradient(145deg,#ffffff,#f0f2f5);
  border-color:#d7dce2;
}
html[data-theme="light"] .reset-code{background:#eef1f4;color:#20262d;border-color:#c7cdd5}
html[data-theme="light"] .menu-panel,
html[data-theme="light"] .backup-restore-pill{background:#ffffff}

/* ============ Layout shells ============ */
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,10,13,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}
.topbar-inner{max-width:1100px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:12px}
.brand-block{display:flex;flex-direction:column;justify-content:center;min-width:0}
.brand{font-size:21px;font-weight:900;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-tutor{font-size:11px;color:var(--muted);font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.teacher-profile-btn{width:46px;height:46px;min-width:46px;border-radius:50%;padding:0;font-size:15px;background:#2a3038;color:#fff;border:1px solid var(--line)}
.teacher-profile-btn.has-image{overflow:hidden;padding:0;display:grid;place-items:center}
.teacher-profile-btn img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;margin:0}

.container{max-width:1100px;margin:auto;padding:18px 18px 90px}
.page-shell{max-width:1100px;margin:auto;padding:18px 18px 90px}

/* ============ Login / setup ============ */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}
.login-box h1{margin:0 0 7px;font-size:28px}
.login-box p{color:var(--muted);margin:0 0 22px}
.lock-screen{text-align:center}
.lock-avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--surface3);border:1px solid var(--line);font-size:25px;font-weight:900;overflow:hidden}
.lock-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.lock-name{font-size:24px;font-weight:900;letter-spacing:-.02em}
.lock-subtitle{font-size:13px;color:var(--muted);margin:6px 0 22px}
.lock-button{min-height:54px;font-size:15px}
.setup-kicker{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.setup-title{font-size:30px;line-height:1.1;margin:7px 0 9px}
.setup-help{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.oneui-class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 22px}
.class-choice{position:relative;min-height:70px;border:1px solid var(--line);border-radius:20px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
.class-choice input{position:absolute;opacity:0;pointer-events:none}
.class-choice.selected{background:rgba(120,152,199,.18);color:#dbe7f8;border-color:rgba(120,152,199,.55);box-shadow:none}
.class-choice .check{position:absolute;right:9px;top:9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#2b3138;color:transparent;font-size:11px}
.class-choice.selected .check{background:#090b0e;color:#fff}

/* ============ Home: overview card, tabs, hero, dashboard ============ */
.home-overview{position:relative;margin:4px 0 14px;padding:10px 12px 12px;border:1px solid rgba(255,255,255,.07);border-radius:26px;
  background:linear-gradient(145deg,rgba(23,28,36,.98),rgba(13,16,22,.99));
  box-shadow:0 7px 20px rgba(0,0,0,.20)}
.class-tabs{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 10px;margin:0;border-bottom:1px solid rgba(255,255,255,.06);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.class-tabs::-webkit-scrollbar{display:none}
.class-tab{flex:0 0 auto;min-width:60px;min-height:40px;padding:9px 15px;border-radius:999px;border:1px solid #343b45;background:#171b21;color:#b9c0c9;font-size:13px;font-weight:800}
.class-tab.active{background:rgba(120,152,199,.20);color:#dbe7f8;border-color:rgba(120,152,199,.55);box-shadow:none}
.hero-welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:78px;padding:14px 6px 4px}
.hero-title{font-size:24px;font-weight:900;line-height:1.15}
.welcome-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.fab{width:46px;height:46px;min-width:46px;padding:0;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.22);-webkit-tap-highlight-color:transparent}
.fab-add{background:#7898c7;color:#071018;border:1px solid rgba(134,166,212,.7)}
.fab-add span{font-size:27px;font-weight:500;line-height:1;transform:translateY(-1px)}
.fab-transaction span{font-size:27px;font-weight:800;line-height:1;transform:translateY(-1px)}
.fab-more{background:#20262f;color:#c8d7eb;border:1px solid #39414c}
.fab-more span{font-size:14px;letter-spacing:2px;line-height:1}
.fab:active{transform:scale(.9)}

.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.stat{min-width:0;min-height:86px;border-radius:20px;padding:15px 16px;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(145deg,#1b2027,#14181e);border:1px solid var(--line);box-shadow:0 5px 14px rgba(0,0,0,.16)}
.stat:first-child .stat-value{color:#9bbcff}
.stat:nth-child(2) .stat-value{color:#8bd8b1}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.stat-value{font-size:24px;font-weight:900;margin-top:5px;letter-spacing:-.02em}

.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:120px}

.contact-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,.14)}
.contact-row{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 14px 12px 17px;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;transition:background .14s ease,transform .12s ease,box-shadow .14s ease}
.contact-row:last-child{border-bottom:0}
.contact-row:hover{background:var(--surface2)}
.contact-row:active{transform:scale(.995)}
.contact-main{position:relative;z-index:2;min-width:0;flex:1}
.student-name{font-size:18px;font-weight:820;line-height:1.25;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-vessel{isolation:isolate}
 .student-vessel-track{position:absolute;z-index:0;inset:0;border:1px solid rgba(255,255,255,.055);border-radius:14px;background:rgba(255,255,255,.009);overflow:hidden;pointer-events:none}
.student-vessel-fill{height:100%;min-height:100%;border-radius:14px;background:linear-gradient(90deg,rgba(115,167,255,.065),rgba(115,167,255,.15));box-shadow:inset 0 0 12px rgba(115,167,255,.035);transition:width .45s cubic-bezier(.22,1,.36,1)}
@media(max-width:520px){.contact-row{padding-left:15px}.student-name{font-size:17px}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}

/* ============ Quick-add sheet (FAB) & More menu — the only popups ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-top-left-radius:24px;border-top-right-radius:24px;width:min(560px,100%);max-height:85vh;overflow:auto;box-shadow:0 -8px 28px rgba(0,0,0,.34);padding-bottom:env(safe-area-inset-bottom,0)}
.sheet-grabber{width:40px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 4px}
.sheet-head{padding:8px 19px 12px;display:flex;align-items:center}
.sheet-head h2{margin:0;font-size:17px}
.sheet-close{margin-left:auto;border:0;background:var(--surface3);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:18px}
.sheet-body{padding:4px 16px 18px}
.choice-btn{width:100%;min-height:56px;text-align:left;display:block;margin-bottom:9px}
.choice-btn:last-child{margin-bottom:0}
.choice-btn b{display:block;font-size:14px;font-weight:800}
.choice-btn span{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-weight:500}

.menu-panel{position:fixed;right:16px;top:82px;bottom:auto;left:auto;width:min(260px,calc(100vw - 32px));max-height:min(55vh,380px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.42);z-index:90;transform-origin:top right;animation:menuPop .14s ease-out}
@keyframes menuPop{from{opacity:0;transform:scale(.96) translateY(-5px)}to{opacity:1;transform:scale(1) translateY(0)}}
.menu-title{padding:9px 10px 8px;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.menu-panel button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:12px;border-radius:14px;font-weight:700}
.menu-panel button:hover{background:var(--surface2)}
.menu-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-size:14px;flex:none}
.backup-restore-pill{display:grid;grid-template-columns:1fr 1fr;margin:4px 0 2px;border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;background:#171b21}
.backup-restore-pill button{border:0!important;border-radius:0!important;margin:0!important;background:transparent!important;min-width:0!important;padding:9px 7px!important;font-size:12px!important;gap:6px!important}
.backup-restore-pill button+button{border-left:1px solid rgba(255,255,255,.1)!important}.backup-restore-pill .menu-icon{width:28px;height:28px;font-size:12px}.backup-restore-pill span:last-child{white-space:nowrap}

/* Compact Manage popup */
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 2px 0}
.menu-head .menu-title{padding:8px 8px 8px 10px}
.menu-close{width:30px!important;height:30px!important;min-width:30px!important;padding:0!important;display:grid!important;place-items:center!important;border:1px solid var(--line)!important;background:var(--surface3)!important;border-radius:50%!important;color:var(--muted)!important;font-size:18px!important;font-weight:500!important}
.menu-close:hover{color:var(--text)!important;background:var(--surface2)!important}

/* ============ Page header (back + title) ============ */
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:24px;font-weight:500;flex:none}
.page-title{font-size:23px;font-weight:850;line-height:1.2}
.page-subtitle{font-size:13px;color:var(--muted);margin-top:3px}

/* ============ Forms: fields + actions (no more clipping — plain document flow) ============ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.add-contact-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.info-box{background:var(--surface2);border-radius:13px;padding:13px;margin-bottom:16px;font-size:13px;line-height:1.6}

.form-section{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.form-section h2{margin:0 0 14px;font-size:15px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.form-actions .btn{flex:1;min-width:130px}
.danger-zone{border-color:rgba(255,107,107,.22)}
.danger-zone h2{color:#ff9a9a}
.danger-zone p{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.danger-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:480px){.danger-actions{grid-template-columns:1fr}}

/* Sticky-but-safe action bar: stays visible while scrolling but is part of the
   page flow, so it can never clip content beneath a modal's max-height. */
.page-actions-bar{position:sticky;bottom:0;left:0;right:0;margin:18px -18px -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0));
  background:linear-gradient(180deg,rgba(8,10,13,0),rgba(8,10,13,.94) 30%);display:flex;gap:10px}
.page-actions-bar .btn{flex:1}

/* ============ Batch add table ============ */
.batch-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;max-height:60vh}
.batch-table{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}
.batch-table th{position:sticky;top:0;background:#20252c;color:var(--muted);font-size:11px;text-align:left;padding:10px;border-bottom:1px solid var(--line);z-index:1}
.batch-table td{padding:5px;border-bottom:1px solid var(--line);background:var(--surface)}
.batch-table tr:last-child td{border-bottom:0}
.batch-table input,.batch-table select{width:100%;min-width:110px;padding:9px;border-radius:11px}
.batch-table .row-num{width:34px;min-width:34px;text-align:center;color:var(--muted);font-size:12px}
.batch-remove{width:38px;min-width:38px;padding:0!important;text-align:center;font-size:20px;line-height:1;color:#ff8b8b}
.batch-hint{font-size:12px;color:var(--muted);margin:8px 0 0}

/* ============ Profile page ============ */
.profile-hero{display:flex;align-items:center;gap:16px;padding:4px 0 20px;flex-wrap:wrap}
.profile-avatar{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:#2a3038;font-size:25px;font-weight:850;flex:none}
.profile-avatar img,.profile-settings-avatar img,.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.profile-photo-preview-overlay{position:fixed;inset:0;z-index:125;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:24px}
.profile-photo-preview{position:relative;width:min(320px,78vw);aspect-ratio:1;border-radius:50%;overflow:visible;background:var(--surface2);border:2px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.profile-photo-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}

<style id="app-motion-system">
:root{
  --motion-fast:150ms;
  --motion-normal:220ms;
  --motion-slow:360ms;
  --motion-ease:cubic-bezier(.22,1,.36,1);
}

/* Smooth state changes */
*{
  -webkit-tap-highlight-color:transparent;
}
button,
input,
select,
textarea,
.card,
.student-row,
.student-list-item,
.student-card,
.class-tab,
.action-card,
.stat-card,
.profile-card,
.menu-item,
.list-item,
.transaction-item,
.progress-card{
  transition:
    transform var(--motion-normal) var(--motion-ease),
    opacity var(--motion-normal) ease,
    background-color var(--motion-normal) ease,
    border-color var(--motion-normal) ease,
    box-shadow var(--motion-normal) ease,
    color var(--motion-normal) ease;
}

/* Press feedback */
button:not(:disabled):active{
  transform:scale(.97);
}
.student-row:active,
.student-list-item:active,
.student-card:active,
.menu-item:active,
.list-item:active{
  transform:scale(.985);
}

/* Interactive hover/focus states where supported */
@media (hover:hover){
  button:not(:disabled):hover{
    transform:translateY(-1px);
  }
  .student-row:hover,
  .student-list-item:hover,
  .student-card:hover,
  .card:hover,
  .action-card:hover{
    transform:translateY(-1px);
  }
}

/* Page content entrance */
#app > *{
  animation:appPageIn var(--motion-slow) var(--motion-ease) both;
}
@keyframes appPageIn{
  from{opacity:0;transform:translateY(8px) scale(.992)}
  to{opacity:1;transform:none}
}

/* List items appear with a subtle stagger */
.student-row,
.student-list-item,
.student-card,
.transaction-item,
.list-item{
  animation:appItemIn 280ms var(--motion-ease) both;
}
@keyframes appItemIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}

/* Progress fill animates when rendered */
.student-vessel-fill{
  animation:progressFillIn 520ms var(--motion-ease) both;
  transform-origin:left center;
}
@keyframes progressFillIn{
  from{opacity:0;transform:scaleX(.72)}
  to{opacity:1;transform:scaleX(1)}
}

/* Modal / popup surfaces */
.modal,
.modal-content,
.dialog,
.popup,
.sheet,
.bottom-sheet{
  animation:appPopupIn 260ms var(--motion-ease) both;
}
@keyframes appPopupIn{
  from{opacity:0;transform:translateY(12px) scale(.975)}
  to{opacity:1;transform:none}
}

/* Toast-style notices */
.toast,
.toast-message,
.snackbar{
  animation:appToastIn 240ms var(--motion-ease) both;
}
@keyframes appToastIn{
  from{opacity:0;transform:translateY(10px) scale(.97)}
  to{opacity:1;transform:none}
}

/* Respect accessibility preferences */
@media (prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:1ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:1ms !important;
  }
}
</style>

<script>
/* ---------- small utilities ---------- */
function haptic(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}
function openNativeDatePicker(el){try{if(el && typeof el.showPicker==="function") el.showPicker();}catch(e){}}
document.addEventListener("focusin",e=>{const el=e.target;if(el && el.matches && el.matches('input[type="date"]')) openNativeDatePicker(el);});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

const KEY = "tuition_fee_manager_v2";
const CLASS_LABELS = ["Nursery","LKG","UKG","1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th","12th"];

const DEFAULT_STATE = {
  teacher:"", brand:"My Tuition", gender:"", theme:"dark", setupDone:false, loggedOut:false, classes:[], activeClass:"",
  session:"April 2026 – March 2027", students:[]
};
function loadState(){
  const raw=localStorage.getItem(KEY);
  if(!raw)return {...DEFAULT_STATE};
  try{
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=="object")return {...DEFAULT_STATE};
    return parsed;
  }catch(e){
    // Corrupted/partial write (e.g. the browser was killed mid-save). Never
    // blank-screen the app — keep the broken JSON around under a backup key
    // in case the data is still partially recoverable, and boot fresh instead.
    try{localStorage.setItem(KEY+"_corrupted_"+Date.now(),raw);}catch(e2){}
    alert("Your saved data could not be read (it may have been corrupted by an interrupted save). Starting fresh — if you have a backup JSON file, use Restore Data from My Profile to bring it back.");
    return {...DEFAULT_STATE};
  }
}
let state = loadState();

/* Fills in defaults and migrates legacy shapes. Runs at load AND after Restore,
   so an imported backup can never leave the app in a half-normalized state. */
function normalizeState(){
  if(!state.students||!Array.isArray(state.students))state.students=[];
  if(!state.classes||!Array.isArray(state.classes))state.classes=[];
  if(!state.leftStudentTransactions||!Array.isArray(state.leftStudentTransactions))state.leftStudentTransactions=[];
  if(!state.gender)state.gender="male";
  if(!state.brand)state.brand="My Tuition";
  if(typeof state.teacherPhoto!=="string")state.teacherPhoto="";
  if(typeof state.loggedOut!=="boolean")state.loggedOut=false;
  if(state.theme!=="light"&&state.theme!=="dark")state.theme="dark";
  if(!state.sessionStart){
    const sm=String(state.session||"").match(/([A-Z][a-z]+) (20\d{2})/);
    const em=String(state.session||"").match(/([A-Z][a-z]+) (20\d{2})$/);
    state.sessionStart=sm?`${sm[2]}-${String(new Date(Date.parse(sm[1]+" 1, 2000")).getMonth()+1).padStart(2,"0")}`:"2026-04";
    state.sessionEnd=em?`${em[2]}-${String(new Date(Date.parse(em[1]+" 1, 2000")).getMonth()+1).padStart(2,"0")}`:"2027-03";
  }
  state.students.forEach(s=>{
    if(!Array.isArray(s.transactions))s.transactions=[];
    if(!Array.isArray(s.contacts))s.contacts=s.contacts?[s.contacts]:[""];
    if(typeof s.photo!=="string")s.photo="";
  });
}
normalizeState();

function monthKey(dateValue=new Date()){
  const d=typeof dateValue==="string" ? new Date(dateValue.includes("T")?dateValue:dateValue+"T00:00:00") : dateValue;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthLabel(key){
  const [y,m]=String(key).split("-").map(Number);
  if(!y||!m)return key;
  return new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});
}
function currentMonthKey(){return monthKey(new Date());}

function activeStudentsForClass(cls=state.activeClass){
  return state.students.filter(s=>(cls==="All" || s.class===cls)&&!s.leftDate);
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    // Storage is full (very commonly caused by large student/teacher photos).
    // Without this, the browser throws here and every action that calls
    // save() — adding a student, recording a payment — silently does
    // nothing, so it LOOKS like the app is broken when it's really just out
    // of space. Tell the user exactly what happened and what to do.
    alert(
      "Could not save — your browser's storage for this app is full.\n\n"+
      "This is almost always caused by profile/student photos, which are stored as full images.\n\n"+
      "What to do:\n"+
      "1. Go to My Profile → Backup Data now, to make sure nothing is lost.\n"+
      "2. Remove a few student or teacher photos (edit their profile → Remove photo) to free up space.\n"+
      "3. Try saving again."
    );
    return false;
  }
}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN");}
function safeFees(v){const n=Number(v);return Number.isFinite(n)&&n>=0?n:0;}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function initials(name){return (name||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(v){if(!v)return "—";return new Date(v+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}

/* Every photo goes through this before it is ever stored. localStorage
   commonly caps out around 5-10MB for the WHOLE app combined — a couple of
   uncompressed phone camera photos (often 3-8MB each) would blow past that
   on their own and start silently failing every future save(). Downscaling
   to a small square JPEG keeps a photo to a few KB instead. */
function compressImageFile(file,maxDim=320,quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("read-failed"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("decode-failed"));
      img.onload=()=>{
        const scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.src=String(reader.result||"");
    };
    reader.readAsDataURL(file);
  });
}
function handlePhotoInput(event,previewId){
  const file=event.target.files?.[0];if(!file)return;
  if(!file.type.startsWith("image/")){event.target.value="";return alert("Please choose an image file.");}
  if(file.size>25*1024*1024){event.target.value="";return alert("Please choose an image smaller than 25 MB.");}
  compressImageFile(file).then(data=>{
    const preview=document.getElementById(previewId);
    if(preview){preview.classList.add("has-image");preview.innerHTML=`<img src="${esc(data)}" alt="">`;}
    const hidden=document.getElementById(previewId==="teacherPhotoPreview"?"teacherPhotoValue":"studentPhotoValue");
    if(hidden)hidden.value=data;
  }).catch(()=>{
    alert("That image could not be processed. Please try a different photo.");
  });
  event.target.value="";
}
function clearPhoto(previewId){
  const preview=document.getElementById(previewId);if(!preview)return;

function totalFeesForProgress(s){return Number(s.totalFees||0);}
function progressRowsForStudent(s){
  return [...(s.transactions||[])].sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
}
function canvasCssVar(name,fallback){
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v||fallback;
}
function roundRectPath(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillRoundRect(ctx,x,y,w,h,r,fill){
  roundRectPath(ctx,x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
}
function strokeRoundRect(ctx,x,y,w,h,r,stroke){
  roundRectPath(ctx,x,y,w,h,r);ctx.strokeStyle=stroke;ctx.stroke();
}
async function progressCanvas(studentId){
  const s=state.students.find(x=>x.id===studentId);if(!s)return null;
  const tx=progressRowsForStudent(s),paid=paidFor(s),balance=Math.max(0,totalFeesForProgress(s)-paid);
  const bg=canvasCssVar("--bg","#080a0d"),surface=canvasCssVar("--surface","#12151a"),surface2=canvasCssVar("--surface2","#191d23");
  const text=canvasCssVar("--text","#f7f7f8"),muted=canvasCssVar("--muted","#a2a9b2"),line=canvasCssVar("--line","#2b3139");
  const totalColor="#73a7ff",paidColor="#65d99a",balanceColor="#ff9b70";
  const c=document.createElement("canvas"),ctx=c.getContext("2d");
  const rowH=62,headerH=330,footerH=38,pad=55;
  c.width=1100;c.height=Math.max(760,headerH+tx.length*rowH+footerH);

  // Use the app's live CSS palette so the shared statement follows the UI theme.
  ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);
  fillRoundRect(ctx,28,28,c.width-56,c.height-56,28,surface);

  ctx.fillStyle=text;ctx.font="800 38px Arial";ctx.fillText("Fee Progress Statement",pad,82);
  ctx.fillStyle=muted;ctx.font="19px Arial";ctx.fillText(String(state.brand||"Tuition Fee Manager"),pad,115);

  ctx.fillStyle=text;ctx.font="800 27px Arial";ctx.fillText("Student: "+String(s.name||"—"),pad,166);
  ctx.fillStyle=muted;ctx.font="18px Arial";ctx.fillText("Class: "+String(s.class||"—")+"  •  Joined: "+fmtDate(s.addedDate),pad,198);

  // Summary cards use the same palette as the in-app Total / Paid / Balance cards.
  const cardY=226,cardH=92,cardGap=18,cardW=(c.width-pad*2-cardGap*2)/3;
  const cards=[
    {x:pad,label:"TOTAL FEES",value:money(s.totalFees),color:totalColor},
    {x:pad+cardW+cardGap,label:"FEES PAID",value:money(paid),color:paidColor},
    {x:pad+(cardW+cardGap)*2,label:"BALANCE",value:money(balance),color:balanceColor}
  ];
  cards.forEach(card=>{
    fillRoundRect(ctx,card.x,cardY,cardW,cardH,18,surface2);
    ctx.fillStyle=card.color;ctx.fillRect(card.x,cardY,5,cardH);
    ctx.fillStyle=muted;ctx.font="700 13px Arial";ctx.fillText(card.label,card.x+20,cardY+28);
    ctx.fillStyle=card.color;ctx.font="800 27px Arial";ctx.fillText(card.value,card.x+20,cardY+66);
  });

  // The progress bar is intentionally app-only. Shared statements contain the
  // financial summary and payment history, but no visual progress indicator.
  let y=350;
  ctx.fillStyle=muted;ctx.font="700 15px Arial";
  ctx.fillText("DATE",pad,y);ctx.fillText("PAYMENT",390,y);ctx.fillText("REMARKS",600,y);
  ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y+18);ctx.lineTo(c.width-pad,y+18);ctx.stroke();
  y+=48;

  tx.forEach(t=>{
    ctx.fillStyle=text;ctx.font="17px Arial";ctx.fillText(fmtDate(String(t.date||"").slice(0,10)),pad,y);
    ctx.fillStyle=paidColor;ctx.font="800 17px Arial";ctx.fillText(money(t.amount),390,y);
    ctx.fillStyle=muted;ctx.font="17px Arial";ctx.fillText(String(t.remark||"—").slice(0,48),600,y);
    ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(pad,y+22);ctx.lineTo(c.width-pad,y+22);ctx.stroke();
    y+=rowH;
  });

  return await new Promise(res=>c.toBlob(res,"image/png"));
}
async function shareProgress(studentId){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;
  const blob=await progressCanvas(studentId);if(!blob)return;
  const file=new File([blob],`fee-progress-${s.name.replace(/[^a-z0-9]+/gi,"-")}.png`,{type:"image/png"});
  // Share only the image. No caption/text is supplied, so apps such as WhatsApp
  // receive the statement as an image without an automatically generated message.
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{await navigator.share({files:[file]});haptic();return;}catch(e){}
  }
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);
  alert("Direct sharing is not supported here, so the statement image was saved instead.");
}

function showSetup(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("setupScreen").classList.remove("hidden");
  renderClassPicker();
}
function renderClassPicker(){
  const chosen=new Set(state.classes);
  document.getElementById("classPicker").innerHTML=CLASS_LABELS.map((c,i)=>`
    <label class="class-choice ${chosen.has(c)?"selected":""}" data-class-choice="${i}">
      <input type="checkbox" value="${esc(c)}" ${chosen.has(c)?"checked":""}>
      <span>${esc(c)}</span><span class="check">✓</span>
    </label>`).join("");
  updateSetupClassCount();
  document.querySelectorAll("#classPicker .class-choice").forEach(label=>{
    const input=label.querySelector("input");
    label.addEventListener("click",e=>{
      if(e.target===input)e.preventDefault();
      input.checked=!input.checked;
      label.classList.toggle("selected",input.checked);
      updateSetupClassCount();
    });
  });
  document.getElementById("sessionStartInput").value=state.sessionStart||"2026-04";
  document.getElementById("sessionEndInput").value=state.sessionEnd||"2027-03";
  const ti=document.getElementById("teacherSetupInput"); if(ti)ti.value=state.teacher||"";
  const ii=document.getElementById("instituteSetupInput"); if(ii)ii.value=state.brand||"";
  const gi=document.getElementById("teacherGenderInput"); if(gi)gi.value=state.gender||"";
}
function updateSetupClassCount(){
  const count=document.querySelectorAll("#classPicker input:checked").length;
  const el=document.getElementById("selectedClassCount");
  if(el)el.textContent=`${count} class${count===1?"":"es"} selected`;
}
function finishSetup(){
  const selected=[...document.querySelectorAll("#classPicker input:checked")].map(x=>x.value);
  if(!selected.length)return alert("Select at least one class.");
  const setupName=(document.getElementById("teacherSetupInput")?.value||"").trim();
  const instituteName=(document.getElementById("instituteSetupInput")?.value||"").trim();
  const gender=(document.getElementById("teacherGenderInput")?.value||"").trim();
  if(setupName)state.teacher=setupName;
  if(!state.teacher)return alert("Enter the tutor name.");
  if(!instituteName)return alert("Enter the institute / tuition name.");
  if(!gender)return alert("Select the teacher gender.");
  state.brand=instituteName;
  state.gender=gender;
  state.classes=selected;
  state.activeClass="All";
  const sessionStart=document.getElementById("sessionStartInput").value||"2026-04";
  const sessionEnd=document.getElementById("sessionEndInput").value||"2027-03";
  if(sessionStart>sessionEnd)return alert("Academic session start cannot be after the end month.");
  state.sessionStart=sessionStart; state.sessionEnd=sessionEnd;
  state.session=`${monthLabel(sessionStart)} – ${monthLabel(sessionEnd)}`;
  state.setupDone=true;save();init();
}

/* ---------- home rendering ---------- */
function getGreeting(){
  const h=new Date().getHours();
  if(h<5)return "Good night";
  if(h<12)return "Good morning";
  if(h<17)return "Good afternoon";
  if(h<21)return "Good evening";
  return "Good night";
}
function updateWelcome(){
  const title=document.getElementById("welcomeTitle");
  if(!title)return;
  const salutation=state.gender==="female"?"Ma'am":"Sir";
  title.textContent=`${getGreeting()}, ${salutation}`;
}
function render(){
  renderClassTabs();
  renderDashboard();
  renderStudents();
  updateWelcome();
}
function renderClassTabs(){
  const el=document.getElementById("classTabs");
  if(!el)return;
  const classes=["All",...(Array.isArray(state.classes)?state.classes:[])];
  el.innerHTML=classes.map((c,i)=>`<button type="button" class="class-tab ${c===state.activeClass?"active":""}" data-class-index="${i}"><span>${esc(c)}</span></button>`).join("");
  el.querySelectorAll(".class-tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const c=classes[Number(btn.dataset.classIndex)];
      if(c)selectClass(c);
    });
  });
}
function selectClass(c){state.activeClass=c;save();render();}
function studentsForClass(){return state.students.filter(s=>(state.activeClass==="All" || s.class===state.activeClass)&&!s.leftDate);}
function paidFor(s){return (s.transactions||[]).reduce((a,t)=>a+Number(t.amount||0),0);}
function renderDashboard(){
  const ss=studentsForClass();
  const key=currentMonthKey();
  const [yy,mm]=key.split("-").map(Number);
  const monthStart=key+"-01";
  const monthEnd=new Date(Date.UTC(yy,mm,0)).toISOString().slice(0,10);
  const monthStudents=ss.filter(s=>{
    const added=String(s.addedDate||"9999-12-31").slice(0,10);
    const left=String(s.leftDate||"9999-12-31").slice(0,10);
    return added<=monthEnd && left>=monthStart;
  });
  // Money actually received this month for this class — must NOT depend on
  // whether the paying student is still active today, or a payment made
  // before a student left/was removed would disappear from this stat.
  const classMatches=cls=>state.activeClass==="All"||cls===state.activeClass;
  const sumThisMonth=list=>list.reduce((a,t)=>{
    const d=String(t.date||"").slice(0,10);
    return a+(d.startsWith(key+"-")?Number(t.amount||0):0);
  },0);
  let monthlyPaid=state.students.filter(s=>classMatches(s.class))
    .reduce((sum,s)=>sum+sumThisMonth(s.transactions||[]),0);
  monthlyPaid+=(state.leftStudentTransactions||[]).filter(b=>classMatches(b.class))
    .reduce((sum,b)=>sum+sumThisMonth(b.transactions||[]),0);
  const monthLabelText=new Date(Date.UTC(yy,mm-1,1)).toLocaleDateString("en-IN",{month:"short",year:"numeric",timeZone:"UTC"});
  document.getElementById("dashboard").innerHTML=`
   <div class="stat"><div class="stat-label">Class Strength · ${monthLabelText}</div><div class="stat-value">${monthStudents.length}</div></div>
   <div class="stat"><div class="stat-label">Fees Collected · ${monthLabelText}</div><div class="stat-value">${money(monthlyPaid)}</div></div>`;
}
function renderStudents(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const ss=studentsForClass().filter(s=>(s.name+" "+(s.father||"")+" "+(s.mother||"")).toLowerCase().includes(q))
    .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"en-IN",{sensitivity:"base",numeric:true}));
  const el=document.getElementById("students");
  if(!ss.length){
    el.innerHTML=`<div class="empty">${q?"No matching students.":state.activeClass==="All"?"No students yet. Tap the + button to add one.":"No students in "+esc(state.activeClass)+" yet. Tap the + button to add one."}</div>`;
    return;
  }
  el.innerHTML=`<div class="contact-list">${ss.map(s=>{
    const total=Math.max(0,Number(s.totalFees||0));
    const paid=Math.max(0,paidFor(s));
    const progress=total>0?Math.min(100,(paid/total)*100):0;
    return `
    <div class="contact-row student-vessel" onclick="showProfilePage('${s.id}')" role="button" tabindex="0" aria-label="Open ${esc(s.name)} profile">
      <div class="student-vessel-track" aria-hidden="true"><div class="student-vessel-fill" style="width:${progress.toFixed(2)}%"></div></div>
      <div class="contact-main">
        <div class="student-name">${esc(s.name)}</div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

/* ---------- page navigation ---------- */
// Every in-app page keeps the exact page it came from. The Back button therefore
// behaves universally instead of assuming that every page was opened from Home.
let pageHistory=[];
function showHomePage(){
  pageHistory=[];
  document.getElementById("pageView").classList.add("hidden");
  document.getElementById("homeView").classList.remove("hidden");
  const avatar=document.getElementById("teacherAvatar");
  avatar.classList.toggle("has-image",!!state.teacherPhoto);
  avatar.innerHTML=state.teacherPhoto?`<img src="${esc(state.teacherPhoto)}" alt="">`:esc(initials(state.teacher));
  avatar.setAttribute("aria-label","Open profile");
  avatar.onclick=showUserProfilePage;
  render();
  window.scrollTo({top:0,behavior:"instant"});
}
function configurePageAvatar(){
  const avatar=document.getElementById("teacherAvatar");
  if(!avatar)return;
  avatar.textContent="‹";
  avatar.setAttribute("aria-label","Go back");
  avatar.onclick=goBack;
}
function showPage(htmlContent){
  const p=document.getElementById("pageView");
  if(!p.classList.contains("hidden") && p.innerHTML.trim()) pageHistory.push(p.innerHTML);
  document.getElementById("homeView").classList.add("hidden");
  p.classList.remove("hidden");
  p.innerHTML=htmlContent;
  configurePageAvatar();
  window.scrollTo({top:0,behavior:"instant"});
}
function restorePage(htmlContent){
  const p=document.getElementById("pageView");
  document.getElementById("homeView").classList.add("hidden");
  p.classList.remove("hidden");
  p.innerHTML=htmlContent;
  configurePageAvatar();
  window.scrollTo({top:0,behavior:"instant"});
}
function goBack(){
  if(pageHistory.length){
    restorePage(pageHistory.pop());
  }else{
    showHomePage();
  }
}
function backToHome(){showHomePage();}
/* Refreshes whichever screen makes sense after a student is edited/saved,
   instead of always snapping back to Home underneath a page the user was on. */
function refreshCurrentView(studentId){
  if(studentId && state.students.some(x=>x.id===studentId)){
    showProfilePage(studentId);
  }else{
    showHomePage();
  }
}

function markStudentLeft(studentId){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return;
  if(s.leftDate){if(!confirm("Clear the left date and mark this student active again?"))return;s.leftDate="";}
  else{if(!confirm(`Mark ${s.name} as left, effective today?`))return;s.leftDate=todayISO();}
  save();haptic();showStudentFormPage(studentId);
}
function addContactField(){
  const wrap=document.getElementById("contactFields");
  if(!wrap)return;
  const div=document.createElement("div");div.className="add-contact-row";
  const n=wrap.querySelectorAll('input[name="contact"]').length+1;
  div.innerHTML=`<input name="contact" type="tel" placeholder="Contact ${n}"><button type="button" class="btn btn-light btn-small" onclick="this.parentElement.remove()">Remove</button>`;
  wrap.appendChild(div);div.querySelector("input").focus();
}
function saveStudent(e,studentId){
  e.preventDefault();const f=new FormData(e.target);
  const name=f.get("name").trim();
  if(!name)return alert("Enter the student's name.");
  const rawFees=Number(f.get("totalFees"));
  const totalFees=Number.isFinite(rawFees)&&rawFees>=0?rawFees:0;
  const contacts=[...e.target.querySelectorAll('input[name="contact"]')].map(x=>x.value.trim()).filter(Boolean);
  const data={name,father:f.get("father").trim(),mother:f.get("mother").trim(),contacts:contacts.length?contacts:[""],remarks:String(f.get("remarks")||"").trim(),class:f.get("class"),totalFees,addedDate:f.get("addedDate"),photo:String(f.get("photo")||"")};

function addBatchRow(values={}){
  const body=document.getElementById("batchBody");if(!body)return;
  const row=body.insertRow();const num=body.rows.length;
  row.innerHTML=`<td class="row-num">${num}</td>
    <td><input data-col="name" value="${esc(values.name||"")}" placeholder="Student name"></td>
    <td><input data-col="father" value="${esc(values.father||"")}"></td>

    <td><select data-col="class">${state.classes.map(c=>`<option ${c===(values.class||(state.activeClass==="All"?state.classes[0]:state.activeClass))?"selected":""}>${esc(c)}</option>`).join("")}</select></td>
    <td><input data-col="fees" type="number" min="0" step="1" value="${esc(values.fees??"")}"></td>
    <td><input data-col="added" type="date" value="${esc(values.added||todayISO())}"></td>
    <td><input data-col="remarks" value="${esc(values.remarks||"")}" placeholder="Remarks"></td>
     <td><button type="button" class="btn btn-danger btn-small batch-remove" onclick="removeBatchRow(this)" aria-label="Remove row">×</button></td>`;
  row.querySelectorAll("input,select").forEach(el=>el.addEventListener("keydown",batchKeyNav));
}
function batchKeyNav(e){
  if(e.key!=="Enter")return;
  e.preventDefault();
  const body=document.getElementById("batchBody"), row=e.target.closest("tr"), col=e.target.dataset.col;
  const nextRow=row.nextElementSibling;
  if(nextRow){const target=nextRow.querySelector(`[data-col="${col}"]`);if(target){target.focus();target.select?.();return;}}
  addBatchRow();const last=body.lastElementChild.querySelector(`[data-col="${col}"]`);if(last){last.focus();last.select?.();}
}
function saveBatchStudents(){
  const rows=[...document.querySelectorAll("#batchBody tr")];let added=0;
  for(const row of rows){
    const get=c=>row.querySelector(`[data-col="${c}"]`)?.value?.trim()||"";
    const name=get("name");if(!name)continue;
    const addedDate=get("added")||todayISO();
    state.students.push({id:id(),name,father:get("father"),mother:get("mother"),contacts:[get("contact")],remarks:get("remarks"),class:get("class")||state.activeClass,totalFees:safeFees(get("fees")),addedDate,leftDate:"",transactions:[]});
    added++;
  }
  if(!added)return alert("Enter at least one student name.");
  if(!save())return;
  haptic();alert(added+" student"+(added===1?"":"s")+" added successfully.");
  showHomePage();
}

function removeBatchRow(btn){
  const body=document.getElementById("batchBody");if(!body||!btn)return;
  if(body.rows.length===1){const row=btn.closest("tr");row.querySelectorAll("input").forEach(x=>x.value="");return;}
  btn.closest("tr")?.remove();
  [...body.rows].forEach((r,i)=>{const n=r.querySelector(".row-num");if(n)n.textContent=i+1;});
}
function batchRowData(row){

function deleteStudentWithTransactions(studentId,deleteTransactions){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;
  if(!deleteTransactions){
    state.leftStudentTransactions=state.leftStudentTransactions||[];
    state.leftStudentTransactions.push({
      id:id(),originalName:s.name,class:s.class,father:s.father||"",mother:s.mother||"",
      deletedDate:todayISO(),transactions:(s.transactions||[]).map(t=>({...t}))
    });
  }
  state.students=state.students.filter(x=>x.id!==studentId);
  save();showHomePage();
}

function showPaymentFormPage(studentId,txId=null){
  const s=state.students.find(x=>x.id===studentId),t=txId?(s.transactions||[]).find(x=>x.id===txId):null;
  const d=String(t?.date||todayISO()).slice(0,10);

    <form onsubmit="saveTransaction(event,'${studentId}','${txId||""}')">

        <div class="form-grid">
          <div class="field"><label>Payment Date</label><input name="date" type="date" required value="${esc(d)}"></div>

          <div class="field full"><label>Remarks</label><textarea name="remark" rows="3">${esc(t?.remark||"")}</textarea></div>
        </div>

          <button class="btn btn-primary">${t?"Update Payment":"Save Payment"}</button>
        </div>

  `);

function saveTransaction(e,studentId,txId){
  e.preventDefault();
  const f=new FormData(e.target),s=state.students.find(x=>x.id===studentId);
  if(!s)return alert("This student no longer exists.");
  const amount=Number(f.get("amount"));
  if(!Number.isFinite(amount)||amount<=0)return alert("Enter a valid payment amount greater than 0.");
  const dateVal=f.get("date");
  if(!dateVal)return alert("Choose a payment date.");
  const data={month:String(dateVal).slice(0,7),date:dateVal,amount,remark:String(f.get("remark")||"").trim()};
  s.transactions=s.transactions||[];
  let savedTx;
  if(txId){
    savedTx=s.transactions.find(t=>t.id===txId);
    if(!savedTx)return alert("This transaction no longer exists.");
    Object.assign(savedTx,data);
  }else{
    savedTx={id:id(),...data};s.transactions.push(savedTx);
  }
  if(!save())return;
  if(txId){showStudentTransactionsPage(s.id);}
  else{showReceiptPage(s.id,savedTx.id);}
}

function totalSessionRevenue(){
  const start=String(state.sessionStart||"").slice(0,7);
  const end=String(state.sessionEnd||"").slice(0,7);
  const today=todayISO().slice(0,7);
  const upper=end && today<end ? today : end;
  const inSession=d=>{
    const key=String(d||"").slice(0,7);
    if(!key)return false;
    return (!start || key>=start) && (!upper || key<=upper);
  };
  let total=0;
  state.students.forEach(s=>(s.transactions||[]).forEach(t=>{if(inSession(t.date))total+=Number(t.amount||0);}));
  (state.leftStudentTransactions||[]).forEach(bucket=>(bucket.transactions||[]).forEach(t=>{if(inSession(t.date))total+=Number(t.amount||0);}));
  return total;
}

function makeResetCode(){
  const words=["amber","atlas","cedar","comet","delta","ember","falcon","forest","harbor","indigo","lunar","maple","orbit","pearl","quartz","river","silver","solar","stone","tiger","violet","willow"];
  const pick=()=>words[Math.floor(Math.random()*words.length)];
  let code=`${pick()} ${pick()} ${pick()}`;
  while(new Set(code.split(" ")).size<3)code=`${pick()} ${pick()} ${pick()}`;

async function receiptCanvas(studentId,txId){

  c.width=900;c.height=1100;ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,c.height);

  rows.forEach(([a,b])=>{ctx.strokeStyle="#dddddd";ctx.beginPath();ctx.moveTo(55,y+12);ctx.lineTo(845,y+12);ctx.stroke();ctx.fillStyle="#555";ctx.font="22px Arial";ctx.fillText(a,55,y);ctx.fillStyle="#111";ctx.font="bold 22px Arial";ctx.fillText(b,845-ctx.measureText(b).width,y);y+=62;});

/* ---------- PDF export ---------- */
function buildPDF(docTitle,subtitle,headers,body){
  if(!window.jspdf)return null;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const rows=[headers,...body];
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.text(String(docTitle||"Report"),24,24);
  if(subtitle){
    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.text(String(subtitle),24,38);
  }
  doc.autoTable({
    startY:subtitle?52:40,
    head:[],
    body:rows,
    theme:"grid",
    styles:{font:"helvetica",fontSize:8,fontStyle:"normal",textColor:[0,0,0],fillColor:false,lineColor:[0,0,0],lineWidth:.25,cellPadding:4},
    tableLineColor:[0,0,0],
    tableLineWidth:.25
  });
  return doc;
}
function exportTransactionReportByRange(){
  const from=document.getElementById("txReportFrom")?.value||"";
  const to=document.getElementById("txReportTo")?.value||"";
  if(!from||!to)return alert("Choose both dates.");
  if(from>to)return alert("The start date cannot be after the end date.");
  const tx=transactionOwnerRows().filter(x=>{
    const d=String(x.t.date||"").slice(0,10);
    return d>=from&&d<=to;
  }).sort((a,b)=>new Date(a.t.date)-new Date(b.t.date));
  if(!tx.length)return alert("No transactions found in this date range.");
  const total=tx.reduce((a,x)=>a+Number(x.t.amount||0),0);
  const rows=tx.map(x=>[
    fmtDate(String(x.t.date||"").slice(0,10)),
    x.s.class||"",
    x.kind==="left"?`Left Student Transactions · ${x.s.originalName||x.s.name}`:x.s.name,
    x.s.father||"—",
    "Rs. "+Number(x.t.amount||0).toLocaleString("en-IN"),
    x.t.remark||""
  ]);
  const doc=buildPDF("Tuition Transactions",`${fmtDate(from)} to ${fmtDate(to)} · ${tx.length} payments · Rs. ${total.toLocaleString("en-IN")} received`,
    ["Date","Class","Student","Father","Amount","Remarks"],rows);
  if(!doc)return alert("PDF library could not load. Check your internet connection and try again.");
  doc.save(`transactions-${from}-to-${to}.pdf`);
}

/* ---------- Backup / Restore ---------- */
function exportDataBackup(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const date=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const time=`${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
  const institute=String(state.brand||"Tuition Fee Manager").trim().replace(/[^a-zA-Z0-9 _-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-")||"Tuition-Fee-Manager";
  const filename=`${institute}-${date}-${time}.json`;
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;const reader=new FileReader();
  reader.onload=()=>{try{
    const data=JSON.parse(reader.result);
    if(!data||typeof data!=="object")throw 0;
    if(!Array.isArray(data.students)||!Array.isArray(data.classes))throw 0;
    const firstLaunch=!state.setupDone && !state.students.length && !state.classes.length;
    if(!firstLaunch && !confirm("Import this backup? Current app data will be replaced.")){e.target.value="";return;}
    state=data;
    normalizeState();
    state.loggedOut=false;
    save();
    init();
  }catch(err){alert("Invalid backup file. Make sure you selected a Tuition Fee Manager backup JSON.");}
  e.target.value="";};
  reader.readAsText(file);
}

init();

/* ---------- gentle pull/scroll bounce on Home ---------- */
(function setupScrollBounce(){
  const home=document.getElementById("homeView");
  if(!home || home.dataset.bounceReady==="1")return;
  home.dataset.bounceReady="1";
  let startY=0, pulling=false;
  home.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    startY=e.touches[0].clientY;pulling=false;home.classList.remove("scroll-bounce");
  },{passive:true});
  home.addEventListener("touchmove",e=>{
    if(e.touches.length!==1)return;
    const y=e.touches[0].clientY,dy=y-startY;
    const atTop=window.scrollY<=0;
    const atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2;
    if((atTop && dy>0)||(atBottom && dy<0)){
      pulling=true;
      const amount=Math.sign(dy)*Math.min(16,Math.pow(Math.abs(dy),0.72));
      home.style.transform=`translate3d(0,${amount}px,0)`;
    }
  },{passive:true});
  home.addEventListener("touchend",()=>{
    if(!pulling)return;
    home.classList.add("scroll-bounce");home.style.transform="translate3d(0,0,0)";pulling=false;
  },{passive:true});
})();
